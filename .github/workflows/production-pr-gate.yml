name: production-pr-gate

on:
  pull_request:
    branches:
      - production

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release guard (static checks)
        run: node scripts/release/guard-production-release.mjs --mode=pr

      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npm run lint -- --no-cache
