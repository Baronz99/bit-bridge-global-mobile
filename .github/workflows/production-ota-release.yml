name: production-ota-release

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CI: 1
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Release guard (full)
        run: node scripts/release/guard-production-release.mjs --mode=release

      - name: Release guard (worktree scope)
        run: pwsh -ExecutionPolicy Bypass -File scripts/release/guard-release-worktree.ps1 --base=origin/production

      - name: Verify phone-first signup env
        shell: bash
        run: |
          export EXPO_PUBLIC_ENABLE_PHONE_FIRST_SIGNUP="${EXPO_PUBLIC_ENABLE_PHONE_FIRST_SIGNUP:-1}"
          echo "EXPO_PUBLIC_ENABLE_PHONE_FIRST_SIGNUP=$EXPO_PUBLIC_ENABLE_PHONE_FIRST_SIGNUP"
          if [ "$EXPO_PUBLIC_ENABLE_PHONE_FIRST_SIGNUP" != "1" ]; then
            echo "EXPO_PUBLIC_ENABLE_PHONE_FIRST_SIGNUP must be 1 for production OTA releases" >&2
            exit 1
          fi

      - name: Publish OTA to production branch
        shell: bash
        run: |
          export EXPO_PUBLIC_ENABLE_PHONE_FIRST_SIGNUP="${EXPO_PUBLIC_ENABLE_PHONE_FIRST_SIGNUP:-1}"
          echo "Publishing with EXPO_PUBLIC_ENABLE_PHONE_FIRST_SIGNUP=$EXPO_PUBLIC_ENABLE_PHONE_FIRST_SIGNUP"
          if [ "$EXPO_PUBLIC_ENABLE_PHONE_FIRST_SIGNUP" != "1" ]; then
            echo "EXPO_PUBLIC_ENABLE_PHONE_FIRST_SIGNUP must be 1 for production OTA releases" >&2
            exit 1
          fi
          npx eas update --branch production --message "release(production): $GITHUB_SHA" --non-interactive
