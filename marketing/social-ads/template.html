<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BitBridge Global Social Ad</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="canvas" class="canvas size-square">
      <div class="aura aura-a"></div>
      <div class="aura aura-b"></div>
      <div class="grain"></div>

      <header class="brand">
        <div class="brand-lockup">
          <img id="logo" class="logo" alt="BitBridge Global logo" />
          <div class="brand-text">
            <div class="brand-name">BitBridge Global</div>
            <div class="brand-trust">Trusted digital finance</div>
          </div>
        </div>
        <div id="tag" class="tag">SECURITY FIRST</div>
      </header>

      <section class="content">
        <div class="copy">
          <h1 id="headline" class="headline">Your money deserves protection.</h1>
          <p id="subtext" class="subtext">Banking built for peace of mind.</p>
          <div id="chips" class="chips"></div>
        </div>

        <div class="phone-stage">
          <div class="phone-shadow"></div>
          <article class="phone">
            <div class="phone-notch"></div>
            <div class="phone-screen">
              <div class="ui-header">
                <div class="ui-date">Today</div>
                <div class="ui-status">Secure Session</div>
              </div>
              <div class="balance-card">
                <div class="label">Wallet balance</div>
                <div id="amount" class="amount">$4,280.20</div>
                <div class="delta">+2.6% this week</div>
              </div>
              <div id="features" class="feature-list"></div>
              <div class="cta-bar">
                <div>Transfer</div>
                <div>Pay Bills</div>
                <div>Top Up</div>
              </div>
            </div>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
